interface:
  display_name: "Fix broken stories"
  short_description: "Fix the stories a Chromatic build could not capture and verify the fix on the next build."
  brand_color: "#FF4785"
  default_prompt: "Fix the broken stories on this branch's Chromatic build."

policy:
  # Safe to trigger implicitly: build reads are read-only, and fixes land only
  # in the working tree.
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "chromatic"
      description: "Chromatic MCP server: builds, tests and capture errors."
