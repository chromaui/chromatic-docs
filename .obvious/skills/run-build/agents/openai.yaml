interface:
  display_name: "Run a Chromatic build"
  short_description: "Run a Chromatic build for the stories being worked on, and report the result."
  brand_color: "#FF4785"
  default_prompt: "Run Chromatic for the Button stories."

policy:
  # Explicit only: every build spends snapshots from the account's quota.
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "chromatic"
      description: "Chromatic MCP server: reads the build the CLI created."
